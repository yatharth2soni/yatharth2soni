name: Update profile stats (live)
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**"]
permissions:
  contents: write
concurrency:
  group: update-stats
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate.py
      - run: cp assets/*.svg docs/assets/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs/assets
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "chore: live stats sync $(date -u +'%d %b %H:%M UTC')"
            git pull --rebase origin main && git push
          fi
