<text x="24" y="28" fill="#aaa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400">$ github --language-bytes</text>
<text x="24" y="48" fill="#ccc" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400">GitHub-reported language byte totals across owned public repositories (excluding forks)</text>
<text x="24" y="104" fill="#ddd" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400">Language data will appear after the first successful Actions sync.</text>
</svg>
