name: Sync GitHub profile README

on:
  schedule:
    - cron: "0 * * * *" # Check hourly for newly pushed repositories and PR updates.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/profile-intro.gif"
      - "assets/contribution-pie.svg"
      - "scripts/sync_profile.py"
      - "scripts/profile_intro.py"
      - ".github/workflows/profile-sync.yml"

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: profile-readme-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer for the circular reveal GIF
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Refresh README tables, circular reveal, and self-hosted SVG charts
        env:
          PROFILE_USERNAME: yatharth2soni
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_profile.py

      - name: Commit generated changes only when files changed
        run: |
          git add README.md assets/profile-intro.gif assets/contribution-graph.svg assets/contribution-pie.svg assets/github-stats.svg assets/language-stats.svg
          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh public GitHub activity"
          git push
