<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180" fill="none">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.8)); }
      }
      @keyframes beamRotate {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -2060; }
      }
      @keyframes circleExpand {
        0% { r: 0; opacity: 1; }
        60% { r: 50; opacity: 0.8; }
        100% { r: 90; opacity: 0; }
      }
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace;
        font-size: 15px;
        fill: #FFFFFF;
        letter-spacing: 0.5px;
      }
      .term-sub {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        fill: rgba(255, 255, 255, 0.65);
      }
      .cursor {
        animation: blink 1s step-start infinite;
      }
      .beam-path {
        stroke: #FFFFFF;
        stroke-width: 2;
        stroke-dasharray: 120 400;
        animation: beamRotate 5s linear infinite;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="180" rx="12" fill="#000000" />
  <rect width="848" height="178" x="1" y="1" rx="11" fill="#050505" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Animated Glowing White Boundary Light Beam -->
  <rect x="1" y="1" width="848" height="178" rx="11" fill="none" class="beam-path" />

  <!-- Window Header -->
  <rect x="1" y="1" width="848" height="34" rx="11" fill="#0D0D0D" />
  <line x1="1" y1="35" x2="849" y2="35" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="18" r="5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="38" cy="18" r="5" fill="#FFFFFF" opacity="0.4" />
  <circle cx="54" cy="18" r="5" fill="#FFFFFF" opacity="0.2" />

  <!-- Terminal Header Title -->
  <text x="75" y="22" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)" font-weight="600">guest@yatharth2soni: ~/profile/README.md</text>
  <text x="760" y="22" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">zsh · UTF-8</text>

  <!-- Animated Expanding Circle Highlight -->
  <g transform="translate(770, 105)">
    <circle cx="0" cy="0" r="16" fill="rgba(255,255,255,0.06)" />
    <circle cx="0" cy="0" r="10" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <animate attributeName="r" values="0;45" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Terminal Content Lines -->
  <g transform="translate(25, 66)">
    <text x="0" y="0" class="term-text" font-weight="700">❯ Yatharth Soni <tspan fill="rgba(255,255,255,0.5)">· Computer Science Student</tspan></text>
    <text x="0" y="26" class="term-sub">» Focus: Data Structures &amp; Algorithms (DSA) • Open-Source Upstream</text>
    <text x="0" y="50" class="term-sub">» Projects: 01/Khanan Suraksha (Mining Governance) • 02/CF Ally (CP Analytics)</text>
    <text x="0" y="74" class="term-text" font-size="13" fill="#FFFFFF">» $ cat about.md &amp;&amp; ls ./toolkit<tspan class="cursor" fill="#FFFFFF">_</tspan></text>
  </g>
</svg>