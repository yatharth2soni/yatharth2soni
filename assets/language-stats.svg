<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-labelledby="title desc">
<title id="title">Public repository language distribution</title><desc id="desc">Monochrome profile graphic generated by GitHub Actions.</desc>
